<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Management System</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Result Management System</h1>

        <form id="resultForm">

            <!-- Student Details -->
            <div class="section">
                <h2>Student Details</h2>

                <label for="studentName">Student Name:</label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name"
                    required
                >

                <label for="rollNumber">Roll Number:</label>
                <input
                    type="text"
                    id="rollNumber"
                    placeholder="Enter roll number"
                    required
                >
            </div>

            <!-- Subject Marks -->
            <div class="section">

                <h2>Subject Marks</h2>

                <label for="maths">Mathematics:</label>
                <input
                    type="number"
                    id="maths"
                    min="0"
                    max="100"
                    placeholder="0 - 100"
                    required
                >

                <label for="physics">Physics:</label>
                <input
                    type="number"
                    id="physics"
                    min="0"
                    max="100"
                    placeholder="0 - 100"
                    required
                >

                <label for="chemistry">Chemistry:</label>
                <input
                    type="number"
                    id="chemistry"
                    min="0"
                    max="100"
                    placeholder="0 - 100"
                    required
                >

                <label for="programming">Programming:</label>
                <input
                    type="number"
                    id="programming"
                    min="0"
                    max="100"
                    placeholder="0 - 100"
                    required
                >

                <label for="english">English:</label>
                <input
                    type="number"
                    id="english"
                    min="0"
                    max="100"
                    placeholder="0 - 100"
                    required
                >

            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button type="submit">
                    Calculate Result
                </button>

                <button type="button" id="clearBtn">
                    Clear
                </button>

            </div>

        </form>

        <!-- Result Section -->
        <div id="resultSection" class="result-section">

            <h2>Student Result</h2>

            <table>

                <tr>
                    <th>Student Name</th>
                    <td id="displayName"></td>
                </tr>

                <tr>
                    <th>Roll Number</th>
                    <td id="displayRoll"></td>
                </tr>

                <tr>
                    <th>Total Marks</th>
                    <td id="displayTotal"></td>
                </tr>

                <tr>
                    <th>Percentage</th>
                    <td id="displayPercentage"></td>
                </tr>

                <tr>
                    <th>Grade</th>
                    <td id="displayGrade"></td>
                </tr>

                <tr>
                    <th>Result</th>
                    <td id="displayResult"></td>
                </tr>

            </table>

        </div>

    </div>

    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Result Management</h1>

        <form id="resultForm">
            <input type="text" id="name"
                   placeholder="Student Name" required>

            <input type="text" id="roll"
                   placeholder="Roll Number" required>

            <input type="number" id="m1"
                   placeholder="Subject 1 Marks" min="0" max="100" required>

            <input type="number" id="m2"
                   placeholder="Subject 2 Marks" min="0" max="100" required>

            <input type="number" id="m3"
                   placeholder="Subject 3 Marks" min="0" max="100" required>

            <button type="submit">Add Result</button>
        </form>

        <h2>Student Results</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll No.</th>
                        <th>Total</th>
                        <th>Percentage</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody id="resultTable"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

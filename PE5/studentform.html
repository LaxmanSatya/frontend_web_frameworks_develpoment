
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Admission Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender label {
            margin: 0;
            font-weight: normal;
        }

        .gender input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Admission Form</h1>

        <form>

            <label for="name">Student Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter student name" required>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>

            <label>Gender</label>

            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="other">
                    Other
                </label>
            </div>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter email address" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter phone number" required>

            <label for="course">Select Course</label>

            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="cse">Computer Science Engineering</option>
                <option value="aiml">Artificial Intelligence & Machine Learning</option>
                <option value="ece">Electronics & Communication Engineering</option>
                <option value="eee">Electrical & Electronics Engineering</option>
                <option value="mech">Mechanical Engineering</option>
            </select>

            <label for="qualification">Previous Qualification</label>

            <select id="qualification" name="qualification">
                <option value="">-- Select Qualification --</option>
                <option value="10th">10th</option>
                <option value="intermediate">Intermediate</option>
                <option value="diploma">Diploma</option>
                <option value="degree">Degree</option>
            </select>

            <label for="marks">Percentage / Marks</label>
            <input type="number" id="marks" name="marks"
                   placeholder="Enter percentage or marks">

            <label for="address">Address</label>
            <textarea id="address" name="address"
                      rows="4"
                      placeholder="Enter your address"></textarea>

            <label for="photo">Upload Student Photo</label>
            <input type="file" id="photo" name="photo"
                   accept="image/*">

            <button type="submit">Submit Admission Form</button>

        </form>

    </div>

</body>
</html>
